name: Build CHAT AI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'assets/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build-android:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.chatai .

      - name: Match Android package with Firebase
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()
          text, ns = re.subn(r'namespace\s*=\s*"[^"]+"', 'namespace = "com.chatai.chatai"', text, count=1)
          text, app = re.subn(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.chatai.chatai"', text, count=1)
          if ns != 1 or app != 1:
              raise SystemExit("Could not safely set Android namespace and applicationId")
          gradle.write_text(text)
          main_files = list(Path("android/app/src/main/kotlin").rglob("MainActivity.kt"))
          if len(main_files) != 1:
              raise SystemExit(f"Expected one MainActivity.kt, found {len(main_files)}")
          main = main_files[0]
          source = main.read_text()
          source, changed = re.subn(r"(?m)^package\s+[^\n]+", "package com.chatai.chatai", source, count=1)
          if changed != 1:
              raise SystemExit("Could not safely update MainActivity package")
          main.write_text(source)
          print("Android package aligned with Firebase: com.chatai.chatai")
          PY

      - name: Install Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing GitHub Actions secret: GOOGLE_SERVICES_JSON"
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json > /dev/null
          echo "Firebase Android configuration installed securely"

      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()
          plugin = '    id("com.google.gms.google-services") version "4.4.2" apply false\n'
          if 'com.google.gms.google-services' not in text:
              marker = 'plugins {\n'
              if marker not in text:
                  raise SystemExit("Could not find plugins block in android/settings.gradle.kts")
              text = text.replace(marker, marker + plugin, 1)
              settings.write_text(text)
          app = Path("android/app/build.gradle.kts")
          text = app.read_text()
          apply = '    id("com.google.gms.google-services")\n'
          if 'com.google.gms.google-services' not in text:
              marker = 'plugins {\n'
              if marker not in text:
                  raise SystemExit("Could not find plugins block in android/app/build.gradle.kts")
              text = text.replace(marker, marker + apply, 1)
              app.write_text(text)
          print("Google Services Gradle plugin configured")
          PY

      - name: Generate CHAT AI launcher icons
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          source = Path("assets/icon/chat_ai_icon.png")
          if not source.exists():
              raise SystemExit(f"Missing launcher icon: {source}")
          image = Image.open(source).convert("RGBA")
          image = ImageOps.fit(image, (512, 512), method=Image.Resampling.LANCZOS)
          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          for folder, size in sizes.items():
              target = Path("android/app/src/main/res") / folder
              target.mkdir(parents=True, exist_ok=True)
              image.resize((size, size), Image.Resampling.LANCZOS).save(target / "ic_launcher.png", optimize=True)
          print("Generated CHAT AI launcher icons from assets/icon/chat_ai_icon.png")
          PY

      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/build.gradle.kts")
          text = path.read_text()
          text, count = re.subn(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 36", text)
          if count == 0:
              raise SystemExit("Could not find compileSdk setting in android/app/build.gradle.kts")
          path.write_text(text)
          print("Android app compileSdk set to 36")
          PY

      - name: Configure Android voice permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
          if "android.permission.RECORD_AUDIO" not in text:
              text = text.replace("<application", permission + "    <application", 1)
          queries = '    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService"/>\n        </intent>\n    </queries>\n'
          if "<queries>" not in text:
              text = text.replace("<application", queries + "    <application", 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Set Android plugin compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          targets = list(cache.glob("file_picker-*/android/build.gradle*"))
          if not targets:
              raise SystemExit("Could not locate file_picker Android Gradle file")
          for path in targets:
              text = path.read_text()
              pattern = re.compile(r"(?m)^(\s*)(compileSdkVersion|compileSdk)(?:\s*=)?\s+.*$")
              updated, count = pattern.subn(
                  lambda m: m.group(1) + (m.group(2) + " = 36" if m.group(2) == "compileSdk" else "compileSdkVersion 36"),
                  text
              )
              if count == 0:
                  raise SystemExit(f"No compileSdk declaration found in {path}; content:\n{text}")
              path.write_text(updated)
              print(f"Set compileSdk 36 in {path} ({count} declaration(s))")
          PY

      - name: Check Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK for App Check testing
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Upload debug APK for App Check testing
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: chat-ai-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
